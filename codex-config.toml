# Deployxa MCP Server Configuration for OpenAI Codex (~/.codex/config.toml)

# Remote Streamable HTTP (Recommended for Production & OAuth 2.1)
[mcp.servers.deployxa]
url = "https://mcp.deployxa.com/mcp"

